<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Timer</title>
    <style>
        :root {
            --bg: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --card: rgba(255,255,255,0.08);
            --text: #e2e8f0;
            --accent: #38bdf8;
            --success: #4ade80;
            --muted: #94a3b8;
        }

        [data-theme="light"] {
            --bg: linear-gradient(145deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            --card: rgba(0,0,0,0.05);
            --text: #1e293b;
            --accent: #0284c7;
            --success: #16a34a;
            --muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .icon { font-size: 3rem; margin-bottom: 0.5rem; }

        .timer {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            color: var(--accent);
            margin: 0.5rem 0;
        }

        .state {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 1rem;
        }

        .state.running { color: var(--success); }

        .details {
            background: var(--card);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            font-size: 0.85rem;
        }

        .detail-label { color: var(--muted); }
        .detail-value { font-weight: 500; }

        .waiting {
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" id="icon">🏃</div>
        <div class="timer" id="timer">--:--</div>
        <div class="state" id="state">Waiting for data...</div>
        <div class="details" id="details" style="display:none">
            <div class="detail-row">
                <span class="detail-label">Started</span>
                <span class="detail-value" id="started">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" id="status">—</span>
            </div>
        </div>
    </div>
    <script type="module" src="./src/timer-app.ts"></script>
</body>
</html>
