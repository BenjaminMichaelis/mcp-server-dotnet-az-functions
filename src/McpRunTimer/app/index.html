<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif);
            background: var(--color-background-primary, #1a1a2e);
            color: var(--color-text-primary, #e2e8f0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        /* Timer selector — hidden until there are 2+ timers */
        .timer-select-wrapper { margin-bottom: 0.75rem; }

        .timer-select {
            background: var(--color-background-secondary, rgba(255,255,255,0.08));
            color: var(--color-text-primary, #e2e8f0);
            border: 1px solid var(--color-border-default, rgba(255,255,255,0.15));
            border-radius: var(--border-radius-sm, 6px);
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
            width: 100%;
            cursor: pointer;
        }

        .icon { font-size: 3rem; margin-bottom: 0.5rem; }

        .timer {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            color: var(--color-accent, #38bdf8);
            margin: 0.5rem 0;
        }

        .state {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-secondary, #94a3b8);
            margin-bottom: 1rem;
        }

        .state.running { color: var(--color-success, #4ade80); }

        .controls {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin: 1rem 0;
        }

        .btn {
            border: none;
            border-radius: var(--border-radius-sm, 8px);
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-start { background: var(--color-success, #4ade80); color: #fff; }
        .btn-stop  { background: var(--color-error, #ef4444); color: #fff; }

        .details {
            background: var(--color-background-secondary, rgba(255,255,255,0.08));
            border-radius: var(--border-radius-md, 12px);
            padding: 1rem;
            margin-top: 1rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            font-size: 0.85rem;
        }

        .detail-label { color: var(--color-text-secondary, #94a3b8); }
        .detail-value { font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-select-wrapper" id="timer-select-wrapper" style="display:none">
            <select class="timer-select" id="timer-select"></select>
        </div>
        <div class="icon" id="icon">⏱</div>
        <div class="timer" id="timer">--:--</div>
        <div class="state" id="state">Ready</div>
        <div class="controls">
            <button class="btn btn-start" id="btn-start">Start</button>
            <button class="btn btn-stop"  id="btn-stop"  disabled>Stop</button>
        </div>
        <div class="details" id="details" style="display:none">
            <div class="detail-row">
                <span class="detail-label">Started</span>
                <span class="detail-value" id="started"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" id="status"></span>
            </div>
        </div>
    </div>
    <script type="module" src="./src/timer-app.ts"></script>
</body>
</html>
